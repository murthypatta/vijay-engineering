# Netlify Configuration for Vijay Engineering Works
# Vite + React Single Page Application (SPA)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Redirect all requests to index.html for Single Page Application routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Global HTTP security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "no-referrer-when-downgrade"

# Cache immutable build assets (JS, CSS, images) for maximum speed
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
